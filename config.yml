# Trust anchor baked into the image. Repo pins, release digests, the hardware
# catalog, and backend credentials are fixed here; a change requires a router
# release. Live hostnames, overload, and cache-route settings refresh from
# UPDATE_CONFIG_URL.

# tinfoilsh/hardware-measurements v0.0.47, the catalog the ATC serves.
hardware_measurements:
  - v0.0.47@d80f92482bfffc1033d2e4b88c0df6e1090e8825d91d43715beb06742ec6a96b

models:
  glm-5.3:
    repo: aptos-labs/confidential-glm-5-3-prod
    # aptos-labs/confidential-glm-5-3-prod v0.0.19, which every host runs. Pin
    # the next release next to it before a host moves, and drop this one after.
    # Older ATC-allowed tags are not accepted until their artifact digests are
    # pinned here.
    releases:
      - v0.0.19@8ef040162fbccecf54a7ad2c7602908b9f8535fa307cc092ea7a03bcd84cf2d5
    backend_auth_env: GLM_BACKEND_API_KEY
    enclaves:
      - host1.inference.aptoslabs.com
      - host0.inference.aptoslabs.com
    overload:
      max_requests_waiting: 20
      clear_requests_waiting: 10
      retry_after_minutes: 1
    cache_route:
      mode: enforced
      retention_window_minutes: 60
      min_prompt_bytes: 4096
      split_threshold_rpm: 10
      max_inflight_delta: 2

  kimi-k3-1-pro:
    repo: aptos-labs/confidential-kimi-k3-1-pro-prod
    # aptos-labs/confidential-kimi-k3-1-pro-prod v0.0.1 on the 8x B300 host.
    # The host boots Intel TDX module 2.0.20 (see acceptedMrSeams).
    releases:
      - v0.0.1@df4b35afb63cf0d529666ea392401ffdeb4b1c90342c4e0deb16e00b2f94ffc6
    backend_auth_env: KIMI_BACKEND_API_KEY
    enclaves:
      - host2.inference.aptoslabs.com
    # One host, so no cache_route block. The backend runs up to 32 requests
    # at once (--max-num-seqs 32).
    overload:
      max_requests_waiting: 20
      clear_requests_waiting: 10
      retry_after_minutes: 1
