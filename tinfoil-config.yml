cvm-version: 0.11.0
cpus: 8
memory: 16384
gpus: 0
models: []

cvm-network:
  inbound-ports:
    - 443

networks:
  router-egress:
    egress: allowlist
    allow:
      - github-proxy.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev
      - api.inference.aptoslabs.com
      - host0.inference.aptoslabs.com
      - host1.inference.aptoslabs.com

containers:
  - name: router
    image: "ghcr.io/aptos-labs/confidential-model-router@sha256:dec0f0ab1a0521e14c5085ee433227fab82858ff8e0a89b76e9a6427344a9882" # v0.0.175-aptos.1
    ipc: private
    restart: always
    networks: [router-egress]
    env:
      - REFRESH_INTERVAL: "1m"
      - CACHE_SALT_ENABLED: "true"
      - USAGE_REPORTER_ID: "model-router"
      - CONTROL_PLANE_URL: "https://api.inference.aptoslabs.com/"
      - UPDATE_CONFIG_URL: "https://api.inference.aptoslabs.com/api/shim/router-config"
    secrets:
      - USAGE_REPORTER_SECRET
      - USAGE_CONTEXT_SECRET
      - GLM_BACKEND_API_KEY
      - METRICS_API_KEY
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
    tmpfs:
      /tmp: size=256m,mode=1777,exec

shim:
  upstream-container: router
  upstream-port: 8089
  paths:
    - /v1/chat/completions
    - /v1/completions
    - /v1/embeddings
    - /v1/models
    - /v1/videos/sync
    - /health
    - /metrics
    - /source
    - /
  dummy-attestation: false
  publish-attestation: false
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/completions
    - /v1/embeddings
    - /v1/models
    - /v1/videos/sync
    - /metrics
  tls-mode: cert-proxy
  tls-challenge: dns
  tls-own-san-domain: true
  control-plane: https://api.inference.aptoslabs.com/
  atc: https://atc.inference.aptoslabs.com
