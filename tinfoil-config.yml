cvm-version: 0.14.15
memory: 16384
cpus: 8

containers:
  - name: "proxy"
    image: "ghcr.io/aptos-labs/confidential-model-router@sha256:cea66e19f6bb4a5559e5172d62f1327e0974de2db8bac5e49e0ad0449d7cad7a" # v0.0.175-aptos.1
    restart: always
    networks: [web]
    env:
      - REFRESH_INTERVAL: "1m"
      - CACHE_SALT_ENABLED: "true"
      - USAGE_REPORTER_ID: "model-router"
      - CONTROL_PLANE_URL: "https://api.tinfoil.sh"
      - UPDATE_CONFIG_URL: "https://api.tinfoil.sh/api/shim/router-config"
    secrets:
      - USAGE_REPORTER_SECRET
      - USAGE_CONTEXT_SECRET
      - CACHE_ROUTE_SECRET
      - METRICS_API_KEY
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /
    - /health
    - /.well-known/tinfoil-proxy
    - /.well-known/prometheus-targets
    - /metrics
    - /v1/*
  authenticated: true
  authenticated-endpoints:
    - /metrics
